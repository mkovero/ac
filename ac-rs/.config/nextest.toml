# cargo-nextest settings, used by bin/gate.sh.
#
# Nothing to configure: no test groups, no port leases. Every test that spawns
# a daemon takes OS-assigned ports and accepts the daemon only when `status`
# reports its own child's pid and its own HOME, retrying on a fresh pair
# otherwise (#486). The three copies of that rule:
# crates/ac-cli/tests/support/mod.rs, crates/ac-view/tests/support.rs,
# crates/ac-daemon/tests/common/mod.rs.
